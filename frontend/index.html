    <style>body{margin:0;background:#F4F7FE}.boot{min-height:100vh;display:grid;place-items:center}.boot-ring{width:56px;height:56px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 28%,#2F6BFF,#18D5C8);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
